; ========================================
; Pyxel Frontend for Emulator (PFE)
; ROCKNIX default configuration
; ========================================
;
; Lines starting with ; or # are comments.
; Global variables are defined first, followed by category definitions.
; Relative script paths are resolved from the PFE directory.
; Relative -DIR paths are resolved from ROM_BASE.
;
; Directory examples:
;   -DIR=nes       -> /roms/nes when ROM_BASE=/roms
;   -DIR=/roms/nes -> /roms/nes
;
; Core examples:
;   -CORE=nestopia      -> RetroArch core nestopia_libretro.so
;   -CORE=ppsspp:ppsspp -> ROCKNIX runemu with emulator=ppsspp, core=ppsspp
;   -CORE=pyxel:pyxel   -> TYPE_PYXEL launcher

; ========================================
; Paths
; ========================================
ROM_BASE=/roms
SCREENSHOT_DIR=/roms/screenshots
BGM_DIR=./assets/bgm

; ROCKNIX RetroArch core symlink/work directory.
; With RA_LAUNCH_MODE=direct, bin/retroarch.sh tries RetroArch first and falls
; back to ROCKNIX runemu when needed.
CORE_PATH=/tmp/cores

; ========================================
; Emulator / launcher scripts
; ========================================
TYPE_RA=./bin/retroarch.sh
TYPE_PYXEL=./bin/pyxel.sh
TYPE_ADVANCEMAME=./bin/rocknix_runemu.sh
TYPE_DUCKSTATION=./bin/rocknix_runemu.sh
TYPE_PPSSPP=./bin/rocknix_runemu.sh
TYPE_MEDNAFEN=./bin/rocknix_runemu.sh
TYPE_DRASTIC=./bin/rocknix_runemu.sh
TYPE_MELONDS=./bin/rocknix_runemu.sh
TYPE_MUPEN64PLUS=./bin/rocknix_runemu.sh
TYPE_YABASANSHIRO=./bin/rocknix_runemu.sh
TYPE_FLYCAST=./bin/rocknix_runemu.sh
TYPE_PICO-8=./bin/rocknix_runemu.sh
TYPE_SCUMMVMSA=./bin/rocknix_runemu.sh
TYPE_SA_PYXEL=./bin/pyxel.sh
TYPE_SA_PPSSPP=./bin/ppsspp.sh
TYPE_SA_DRASTIC=./bin/drastic.sh
TYPE_SA_YABASANSHIRO=./bin/yabasanshiro.sh
RESUME_AFTER_GAME=true
PYXEL_LAUNCH_MODE=handoff
RA_LAUNCH_MODE=direct

; ========================================
; Debug logging
; ========================================
DEBUG=false
DEBUG_LEVEL=DEBUG
DEBUG_LOG=data/debug.log
DEBUG_CONSOLE=true

; ========================================
; Status display
; ========================================
SHOW_CLOCK=true
SHOW_BATTERY=true
SHOW_NETWORK=true
NETWORK_CHECK_INTERVAL_SECONDS=60
NETWORK_SCRIPT_LOG_INTERVAL_SECONDS=60

; ========================================
; WiFi scripts for network management
; ROCKNIX uses ConnMan, so the default points at the ConnMan sample scripts.
; ========================================
WIFI_SCAN_SCRIPT=./scripts/samples/connman/wifi_scan.sh
WIFI_SCAN_TIMEOUT=30
WIFI_SCAN_WAIT_SECONDS=6
WIFI_CONNECT_SCRIPT=./scripts/samples/connman/wifi_connect.sh
WIFI_STATUS_SCRIPT=./scripts/samples/connman/wifi_status.sh
WIFI_TOGGLE_SCRIPT=./scripts/samples/connman/wifi_toggle.sh

; ========================================
; Bluetooth scripts for device management
; ========================================
BT_SCAN_SCRIPT=./scripts/bt_scan.sh
BT_PAIR_SCRIPT=./scripts/bt_pair.sh
BT_STATUS_SCRIPT=./scripts/bt_status.sh
BT_TOGGLE_SCRIPT=./scripts/bt_toggle.sh

; ========================================
; System monitor scripts
; ========================================
BATTERY_SCRIPT=./scripts/get_battery.sh
NETWORK_SCRIPT=./scripts/get_network.sh
CPU_GOVERNOR_GET_SCRIPT=./scripts/get_cpu_governor.sh
CPU_GOVERNOR_SET_SCRIPT=./scripts/set_cpu_governor.sh
DATETIME_SET_SCRIPT=./scripts/set_datetime.sh

; ========================================
; System power scripts
; ========================================
REBOOT_SCRIPT=./scripts/system_reboot.sh
SHUTDOWN_SCRIPT=./scripts/system_shutdown.sh
RESTART_PFE_SCRIPT=./scripts/restart_pfe.sh
SWITCH_TO_ES_SCRIPT=./scripts/switch_to_es.sh

